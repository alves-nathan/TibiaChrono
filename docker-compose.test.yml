services:
  db-test:
    image: postgres:15-alpine
    container_name: tibiachrono-db-test
    environment:
      POSTGRES_DB: tibiastats_test
      POSTGRES_USER: tibia
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tibia -d tibiastats_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
